# Local PostGIS for the SQL version of the screening (pvscreen/postgis.py).
# Started by `python -m pvscreen.postgis <teryt>`, or by hand: docker compose up -d --wait
# Local development only: the password is not a secret and the port is bound to 127.0.0.1.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pvscreen
      POSTGRES_PASSWORD: pvscreen
      POSTGRES_DB: pvscreen
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvscreen -d pvscreen"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
