[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pvscreen"
version = "0.1.0"
description = "Screening Polish municipalities for solar-farm sites with open data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Szymon Wypler" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
postgis = ["sqlalchemy>=2.0", "geoalchemy2>=0.15", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "pvscreen[postgis]"]

[tool.setuptools]
packages = ["pvscreen"]

[tool.setuptools.package-data]
pvscreen = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
